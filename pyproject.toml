[project]
name = "titanic-ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seif_Haytham", email = "seifeldinhaytham@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagshub>=0.7.1",
    "dvc>=3.67.1",
    "hydra-core>=1.3.5",
    "joblib>=1.5.3",
    "mlflow>=3.0.0",
    "protobuf>=5.0.0,<7.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.9.0",
]

[project.scripts]
titanic-ai-engineering = "titanic_ai_engineering:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
